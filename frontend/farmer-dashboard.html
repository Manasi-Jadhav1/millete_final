<!DOCTYPE html>
<html lang="en" style="scroll-behavior:smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilletVerse — Farmer Dashboard</title>
    <meta name="description" content="MilletVerse Farmer Dashboard — manage your harvest, scanner, and orders.">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary:'#5b2d22', primaryLight:'#faf7f2', primaryDark:'#3d1e17',
                        accent:'#d4a373', textDark:'#2c1810'
                    },
                    fontFamily: { sans:['Inter','sans-serif'], heading:['Outfit','sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary:#5b2d22; --accent:#d4a373; --dark:#3d1e17; }
        body { background:#faf7f2; }
        .sidebar { background:#3d1e17; width:265px; min-height:100vh; position:fixed; top:0; left:0; display:flex; flex-direction:column; z-index:100; }
        .nav-btn { display:flex; align-items:center; gap:12px; padding:13px 18px; border-radius:12px; font-size:0.62rem; font-weight:900; text-transform:uppercase; letter-spacing:0.12em; color:rgba(255,255,255,0.5); cursor:pointer; transition:all 0.2s; border:none; background:none; width:100%; text-align:left; }
        .nav-btn:hover { background:rgba(255,255,255,0.08); color:#fff; }
        .nav-btn.active { background:var(--accent); color:var(--dark) !important; }
        .card { background:#fff; border-radius:20px; border:1px solid #f0ebe3; box-shadow:0 4px 20px rgba(44,24,16,0.05); }
        .field-label { font-size:0.6rem; font-weight:900; letter-spacing:0.25em; text-transform:uppercase; color:var(--accent); margin-bottom:7px; display:block; }
        .field-input { width:100%; background:#faf7f2; border:1.5px solid #e8ddd3; border-radius:11px; padding:11px 15px; font-size:0.85rem; font-weight:600; color:#2c1810; outline:none; transition:all 0.2s; box-sizing:border-box; }
        .field-input:focus { border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(212,163,115,0.12); }
        .btn-p { background:var(--primary); color:#fff; font-size:0.65rem; font-weight:900; text-transform:uppercase; letter-spacing:0.12em; padding:13px 26px; border-radius:12px; border:none; cursor:pointer; transition:all 0.2s; display:inline-flex; align-items:center; gap:8px; }
        .btn-p:hover { background:var(--dark); transform:translateY(-1px); }
        .badge { display:inline-flex; align-items:center; font-size:0.55rem; font-weight:900; text-transform:uppercase; letter-spacing:0.08em; padding:4px 10px; border-radius:99px; }
        .tab-btn { padding:8px 14px; border-radius:8px; font-size:0.6rem; font-weight:900; text-transform:uppercase; letter-spacing:0.08em; border:1.5px solid #e8ddd3; background:#fff; cursor:pointer; transition:all 0.15s; color:#8b736b; }
        .tab-btn.active { background:var(--primary); color:#fff; border-color:var(--primary); }
        .progress-track { height:8px; background:#f0ebe3; border-radius:99px; overflow:hidden; }
        .progress-bar { height:100%; border-radius:99px; transition:width 0.7s ease; }
        #toastbox { position:fixed; bottom:1.5rem; right:1.5rem; z-index:9999; display:flex; flex-direction:column; gap:8px; }
        .toast-item { padding:13px 18px; border-radius:12px; font-size:0.75rem; font-weight:700; animation:slideIn 0.3s ease; }
        @keyframes slideIn { from{transform:translateX(110%);opacity:0} to{transform:translateX(0);opacity:1} }
        .st-pending   { background:#fff8e6; color:#b45309; }
        .st-confirmed { background:#eff6ff; color:#1d4ed8; }
        .st-shipped   { background:#f5f3ff; color:#6d28d9; }
        .st-delivered { background:#ecfdf5; color:#065f46; }
        .st-cancelled { background:#fef2f2; color:#991b1b; }
        .upload-zone { border:2px dashed #e8ddd3; border-radius:14px; padding:32px 20px; text-align:center; cursor:pointer; transition:all 0.2s; }
        .upload-zone:hover, .upload-zone.drag { border-color:var(--accent); background:#fffbf7; }
        @media(max-width:1024px) { .sidebar{display:none;} .main-wrap{margin-left:0!important;} }
    </style>
</head>
<body class="font-sans antialiased">

<div id="toastbox"></div>

<!-- SIDEBAR -->
<aside class="sidebar">
    <div style="padding:26px 22px 18px;border-bottom:1px solid rgba(255,255,255,0.07);">
        <a href="index.html" class="flex flex-col">
            <span style="font-family:'Outfit',sans-serif;font-weight:900;font-size:1.35rem;letter-spacing:0.15em;color:#fff;">MILLETVERSE</span>
            <span id="dashboard-title" style="font-size:0.48rem;font-weight:900;letter-spacing:0.4em;color:var(--accent);text-transform:uppercase;margin-top:3px;">Farmer Dashboard</span>
        </a>
    </div>
    <div style="padding:18px 22px;border-bottom:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:12px;">
        <div style="width:42px;height:42px;border-radius:12px;background:var(--accent);display:flex;align-items:center;justify-content:center;flex-shrink:0;">
            <i id="role-icon" class="fa-solid fa-tractor" style="color:var(--dark);font-size:1rem;"></i>
        </div>
        <div>
            <p id="sidebar-name" style="font-size:0.72rem;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:0.07em;">Farmer</p>
            <p id="role-subtitle" style="font-size:0.52rem;font-weight:900;letter-spacing:0.18em;text-transform:uppercase;color:#6ee7b7;margin-top:2px;">Verified Producer</p>
        </div>
    </div>
    <nav style="flex:1;padding:14px;display:flex;flex-direction:column;gap:3px;overflow-y:auto;">
        <p style="font-size:0.48rem;font-weight:900;letter-spacing:0.4em;color:rgba(255,255,255,0.28);text-transform:uppercase;padding:8px 4px 10px;">Harvest Menu</p>
        <button class="nav-btn active" id="nav-add-product" onclick="show('add-product')"><i class="fa-solid fa-plus-circle" style="width:16px;text-align:center;"></i> Add Product</button>
        <button class="nav-btn"        id="nav-my-products" onclick="show('my-products')"><i class="fa-solid fa-seedling"    style="width:16px;text-align:center;"></i> My Products</button>
        <button class="nav-btn"        id="nav-scanner"     onclick="show('scanner')">    <i class="fa-solid fa-qrcode"      style="width:16px;text-align:center;"></i> Payment Scanner</button>
        <button class="nav-btn"        id="nav-orders"      onclick="show('orders')">     <i class="fa-solid fa-box-open"    style="width:16px;text-align:center;"></i> Customer Orders</button>
        <button class="nav-btn"        id="nav-analytics"   onclick="show('analytics')">  <i class="fa-solid fa-chart-line"  style="width:16px;text-align:center;"></i> Analytics</button>
        <div style="flex:1;min-height:20px;"></div>
        <button onclick="milletLogout()" class="nav-btn" style="color:rgba(255,100,100,0.65);"><i class="fa-solid fa-right-from-bracket" style="width:16px;text-align:center;"></i> Logout</button>
    </nav>
</aside>

<!-- MAIN CONTENT -->
<div class="main-wrap" style="margin-left:265px;min-height:100vh;">
    <!-- Mobile bar -->
    <div style="background:#3d1e17;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;" class="lg:hidden">
        <span style="font-family:'Outfit',sans-serif;font-weight:900;font-size:1rem;color:#fff;letter-spacing:0.12em;">MILLETVERSE</span>
        <div style="display:flex;gap:5px;overflow-x:auto;">
            <button class="tab-btn" onclick="show('add-product')" style="font-size:0.55rem;">+ Add</button>
            <button class="tab-btn" onclick="show('my-products')" style="font-size:0.55rem;">Products</button>
            <button class="tab-btn" onclick="show('scanner')"     style="font-size:0.55rem;">Scanner</button>
            <button class="tab-btn" onclick="show('orders')"      style="font-size:0.55rem;">Orders</button>
            <button class="tab-btn" onclick="show('analytics')"   style="font-size:0.55rem;">Analytics</button>
        </div>
    </div>
    <div style="padding:36px 40px;" id="content-area"></div>
</div>

<script src="auth.js"></script>
<script src="script.js"></script>
<script>
const API = 'http://localhost:5000/api';
let farmer = null;

document.addEventListener('DOMContentLoaded', () => {
    farmer = JSON.parse(localStorage.getItem('milletSession'));
    if (!farmer || !['farmer','startup','seller'].includes(farmer.role)) {
        window.location.href = 'login.html'; return;
    }
    
    // Dynamic Role Branding
    if (farmer.role === 'startup') {
        document.title = 'MilletVerse — Startup Seller Dashboard';
        document.getElementById('dashboard-title').textContent = 'Startup Seller';
        document.getElementById('role-subtitle').textContent = 'Verified Startup';
        document.getElementById('role-icon').className = 'fa-solid fa-rocket';
    }
    
    document.getElementById('sidebar-name').textContent = `${farmer.firstName||'User'} ${farmer.lastName||''}`.trim();
    show('add-product');
});

function toast(msg, type='success') {
    const box = document.getElementById('toastbox');
    const el  = document.createElement('div');
    const s   = { success:'background:#ecfdf5;color:#065f46;border:1px solid #6ee7b7', error:'background:#fef2f2;color:#991b1b;border:1px solid #fca5a5', info:'background:#eff6ff;color:#1e40af;border:1px solid #93c5fd' };
    el.className = 'toast-item'; el.style.cssText = s[type]||s.success; el.innerHTML = msg;
    box.appendChild(el); setTimeout(() => el.remove(), 4000);
}

// ─── Data Helpers ───────────────────────────────────
function myProducts()  {
    const all = JSON.parse(localStorage.getItem('milletProducts')||'[]');
    return all.filter(p => p.farmer_email === farmer.email || String(p.farmer_id) === String(farmer.id));
}
function allOrders() { return JSON.parse(localStorage.getItem('milletOrders')||'[]'); }
function myOrders() {
    return allOrders().filter(o =>
        o.farmer_email === farmer.email || String(o.farmer_id)===String(farmer.id) ||
        (o.items||[]).some(i => i.farmer_email===farmer.email || String(i.farmer_id)===String(farmer.id))
    );
}
function getScanner()  { return localStorage.getItem(`farmer_scanner_${farmer.email}`) || localStorage.getItem('farmer_scanner_default') || ''; }
function saveScanner(v){ localStorage.setItem(`farmer_scanner_${farmer.email}`, v); localStorage.setItem('farmer_scanner_default', v); }
function hdrs()        { return { 'Authorization':`Bearer ${farmer?.token}`, 'Content-Type':'application/json' }; }

// ─── Routing ────────────────────────────────────────
function show(section) {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(`nav-${section}`)?.classList.add('active');
    ({ 'add-product':renderAddProduct, 'my-products':renderMyProducts, 'scanner':renderScanner, 'orders':renderOrders, 'analytics':renderAnalytics })[section]?.();
}

// ════════════════════════════════════════════════════
// 1.  ADD PRODUCT
// ════════════════════════════════════════════════════
function renderAddProduct() {
    document.getElementById('content-area').innerHTML = `
    <div style="margin-bottom:32px;">
        <h1 style="font-family:'Outfit',sans-serif;font-size:2.3rem;font-weight:900;color:#2c1810;line-height:1.1;">List New Harvest</h1>
        <p style="font-size:0.78rem;font-weight:700;color:#8b736b;margin-top:6px;text-transform:uppercase;letter-spacing:0.12em;">Add your millet product to the MilletVerse marketplace</p>
    </div>
    <div class="card" style="padding:40px;max-width:760px;">
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:22px;">
            <div style="grid-column:1/-1;">
                <label class="field-label">Product Name *</label>
                <input id="p-name" class="field-input" placeholder="e.g. Organic Pearl Millet Flour">
            </div>
            <div>
                <label class="field-label">Millet Type *</label>
                <select id="p-type" class="field-input">
                    <option value="">Select type...</option>
                    <option>Pearl Millet (Bajra)</option><option>Finger Millet (Ragi)</option>
                    <option>Foxtail Millet (Kangni)</option><option>Sorghum (Jowar)</option>
                    <option>Little Millet (Kutki)</option><option>Kodo Millet</option>
                    <option>Barnyard Millet</option><option>Mixed Millet Blend</option>
                </select>
            </div>
            <div>
                <label class="field-label">Category</label>
                <select id="p-cat" class="field-input">
                    <option>Grain</option><option>Flour</option><option>Flakes</option>
                    <option>Ready to Cook</option><option>Organic</option><option>Value Added</option>
                </select>
            </div>
            <div>
                <label class="field-label">Price per unit (₹) *</label>
                <input id="p-price" class="field-input" type="number" min="1" placeholder="e.g. 120">
            </div>
            <div>
                <label class="field-label">Stock Quantity *</label>
                <input id="p-stock" class="field-input" type="number" min="1" placeholder="e.g. 50">
            </div>
            <div style="grid-column:1/-1;">
                <label class="field-label">Unit Size</label>
                <input id="p-unit" class="field-input" placeholder="e.g. 500g, 1kg, per piece">
            </div>
            <div style="grid-column:1/-1;">
                <label class="field-label">Description</label>
                <textarea id="p-desc" class="field-input" rows="3" style="resize:vertical;" placeholder="Describe your harvest — origin, freshness, nutrition..."></textarea>
            </div>
            <div style="grid-column:1/-1;">
                <label class="field-label">Product Image URL (optional)</label>
                <input id="p-img" class="field-input" placeholder="https://... leave blank for default">
            </div>
            <div style="grid-column:1/-1;">
                <label class="field-label">Tags (comma separated)</label>
                <input id="p-tags" class="field-input" placeholder="e.g. Organic, Gluten-Free, Sun-dried">
            </div>
            <div style="grid-column:1/-1;padding-top:8px;">
                <button class="btn-p" onclick="submitProduct()" id="submit-btn" style="width:100%;justify-content:center;padding:16px;font-size:0.7rem;">
                    <i class="fa-solid fa-seedling"></i> List This Harvest
                </button>
            </div>
        </div>
    </div>`;
}

async function submitProduct() {
    const name  = document.getElementById('p-name').value.trim();
    const type  = document.getElementById('p-type').value;
    const price = parseFloat(document.getElementById('p-price').value);
    const stock = parseInt(document.getElementById('p-stock').value);
    if (!name||!type||!price||!stock) { toast('Fill all required (*) fields.','error'); return; }

    const btn = document.getElementById('submit-btn');
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Listing...'; btn.disabled = true;

    const product = {
        id: Date.now(), name,
        millet_type:   document.getElementById('p-type').value,
        category:      document.getElementById('p-cat').value,
        price, stock_quantity: stock,
        unit:          document.getElementById('p-unit').value.trim() || '1kg',
        description:   document.getElementById('p-desc').value.trim(),
        image_url:     document.getElementById('p-img').value.trim() || 'https://images.unsplash.com/photo-1542838132-92c53300491e?w=400',
        tags:          document.getElementById('p-tags').value.split(',').map(t=>t.trim()).filter(Boolean),
        rating: 4.5,
        farmer_name:   `${farmer.firstName||''} ${farmer.lastName||''}`.trim(),
        farmer_email:  farmer.email,
        farmer_id:     farmer.id,
        farmer_scanner: getScanner(),
        created_at:    new Date().toISOString(),
        approved: true
    };

    try {
        const r = await fetch(`${API}/products`,{method:'POST',headers:hdrs(),body:JSON.stringify(product)});
        const d = await r.json(); if(d.success&&d.data?.id) product.id=d.data.id;
    } catch(e) {}

    const all = JSON.parse(localStorage.getItem('milletProducts')||'[]');
    all.push(product);
    localStorage.setItem('milletProducts', JSON.stringify(all));

    toast(`<i class="fa-solid fa-check-circle mr-1"></i><strong>${name}</strong> listed!`);
    btn.innerHTML = '<i class="fa-solid fa-seedling"></i> List This Harvest'; btn.disabled = false;
    ['p-name','p-price','p-stock','p-desc','p-img','p-tags','p-unit'].forEach(id => { const el=document.getElementById(id); if(el) el.value=''; });
    setTimeout(() => show('my-products'), 800);
}

// ════════════════════════════════════════════════════
// 2.  MY PRODUCTS
// ════════════════════════════════════════════════════
function renderMyProducts() {
    const products = myProducts();
    document.getElementById('content-area').innerHTML = `
    <div style="margin-bottom:32px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;">
        <div>
            <h1 style="font-family:'Outfit',sans-serif;font-size:2.3rem;font-weight:900;color:#2c1810;line-height:1.1;">My Harvest Listings</h1>
            <p style="font-size:0.78rem;font-weight:700;color:#8b736b;margin-top:6px;text-transform:uppercase;letter-spacing:0.12em;">${products.length} product${products.length!==1?'s':''} on marketplace</p>
        </div>
        <button class="btn-p" onclick="show('add-product')"><i class="fa-solid fa-plus"></i> Add New</button>
    </div>
    ${products.length===0 ? `
        <div class="card" style="padding:60px;text-align:center;">
            <i class="fa-solid fa-seedling" style="font-size:3rem;color:#d4a373;margin-bottom:14px;display:block;"></i>
            <h3 style="font-family:'Outfit',sans-serif;font-weight:900;color:#2c1810;font-size:1.2rem;margin-bottom:8px;">No Products Yet</h3>
            <p style="font-size:0.83rem;color:#8b736b;font-weight:600;">Start by listing your first harvest product.</p>
            <button class="btn-p" onclick="show('add-product')" style="margin-top:22px;"><i class="fa-solid fa-plus-circle"></i> List First Harvest</button>
        </div>` :
    `<div style="display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:16px;">
        ${products.map(p=>`
        <div class="card" style="padding:18px;" id="prod-${p.id}">
            <div style="display:flex;gap:14px;">
                <img src="${p.image_url}" style="width:72px;height:72px;border-radius:12px;object-fit:cover;flex-shrink:0;background:#f0ebe3;"
                    onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=100'">
                <div style="flex:1;min-width:0;">
                    <p style="font-weight:900;color:#2c1810;font-size:0.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${p.name}</p>
                    <p style="font-size:0.62rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:#8b736b;margin-top:3px;">${p.millet_type||'Grain'}</p>
                    <p style="font-size:1.25rem;font-weight:900;color:#5b2d22;margin-top:5px;">₹${p.price}</p>
                    <div style="display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;">
                        <span class="badge" style="background:#ecfdf5;color:#065f46;">Stock: ${p.stock_quantity}</span>
                        <span class="badge" style="background:#faf7f2;color:#8b736b;">${p.unit||'1kg'}</span>
                        ${p.farmer_scanner ? `<span class="badge" style="background:#fff8e6;color:#b45309;"><i class="fa-solid fa-qrcode mr-1"></i>QR</span>` : ''}
                    </div>
                </div>
            </div>
            <div style="display:flex;gap:8px;margin-top:14px;padding-top:14px;border-top:1px solid #f0ebe3;">
                <button onclick="editStock('${p.id}',${p.stock_quantity})"
                    style="flex:1;padding:8px;border-radius:8px;background:#eff6ff;color:#1d4ed8;font-size:0.58rem;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;border:1px solid #93c5fd;cursor:pointer;">
                    <i class="fa-solid fa-pen mr-1"></i> Stock
                </button>
                <button onclick="deleteProduct('${p.id}')"
                    style="flex:1;padding:8px;border-radius:8px;background:#fef2f2;color:#991b1b;font-size:0.58rem;font-weight:900;text-transform:uppercase;letter-spacing:0.08em;border:1px solid #fca5a5;cursor:pointer;">
                    <i class="fa-solid fa-trash mr-1"></i> Remove
                </button>
            </div>
        </div>`).join('')}
    </div>`}`;
}

function deleteProduct(id) {
    if (!confirm('Remove this product from the marketplace?')) return;
    const all = JSON.parse(localStorage.getItem('milletProducts')||'[]');
    localStorage.setItem('milletProducts', JSON.stringify(all.filter(p => String(p.id)!==String(id))));
    document.getElementById(`prod-${id}`)?.remove();
    toast('Product removed.','info');
}

function editStock(id, current) {
    const nq = prompt(`Update stock quantity (current: ${current}):`, current);
    if (nq===null||isNaN(parseInt(nq))) return;
    const all = JSON.parse(localStorage.getItem('milletProducts')||'[]');
    const idx = all.findIndex(p=>String(p.id)===String(id));
    if(idx>-1){ all[idx].stock_quantity=parseInt(nq); localStorage.setItem('milletProducts',JSON.stringify(all)); }
    toast('Stock updated!'); show('my-products');
}

// ════════════════════════════════════════════════════
// 3.  PAYMENT SCANNER
// ════════════════════════════════════════════════════
let scannerTab = 'url';
let pendingB64 = '';

function renderScanner() {
    const existing = getScanner();
    const isBase64 = existing.startsWith('data:image');
    document.getElementById('content-area').innerHTML = `
    <div style="margin-bottom:32px;">
        <h1 style="font-family:'Outfit',sans-serif;font-size:2.3rem;font-weight:900;color:#2c1810;line-height:1.1;">Payment QR Scanner</h1>
        <p style="font-size:0.78rem;font-weight:700;color:#8b736b;margin-top:6px;text-transform:uppercase;letter-spacing:0.12em;">Buyers see this scanner when they choose Online UPI payment</p>
    </div>

    ${existing ? `
    <div class="card" style="padding:28px;margin-bottom:22px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;">
        <div style="text-align:center;">
            <p style="font-size:0.58rem;font-weight:900;text-transform:uppercase;letter-spacing:0.2em;color:#8b736b;margin-bottom:10px;">Your Active Scanner</p>
            <img src="${existing}" id="sc-preview"
                style="max-width:180px;max-height:180px;object-fit:contain;border-radius:14px;border:3px solid var(--accent);"
                onerror="this.parentElement.innerHTML='<div style=padding:16px;background:#fef2f2;border-radius:12px;color:#991b1b;font-size:0.75rem;font-weight:700;>Image failed to load</div>'">
        </div>
        <div>

function switchTab(tab) {
    scannerTab = tab;
    document.getElementById('tab-url').classList.toggle('active', tab==='url');
    document.getElementById('tab-image').classList.toggle('active', tab==='image');
    document.getElementById('panel-url').style.display   = tab==='url'   ? '' : 'none';
    document.getElementById('panel-image').style.display = tab==='image' ? '' : 'none';
}

function saveFromUrl() {
    const url = document.getElementById('scanner-url').value.trim();
    if (!url) { toast('Please enter a valid URL.','error'); return; }
    saveScanner(url);
    updateProductScanner(url);
    toast('<i class="fa-solid fa-check-circle mr-2"></i>Scanner saved! Buyers will see your QR at checkout.');
    setTimeout(() => renderScanner(), 500);
}

function handleFileSelect(e) { const f=e.target.files[0]; if(f) processFile(f); }
function handleDrop(e) {
    e.preventDefault(); document.getElementById('upload-zone').classList.remove('drag');
    const f = e.dataTransfer.files[0]; if(f&&f.type.startsWith('image/')) processFile(f);
}
function processFile(file) {
    if (file.size > 2*1024*1024) { toast('File too large. Max 2MB.','error'); return; }
    const reader = new FileReader();
    reader.onload = e => {
        pendingB64 = e.target.result;
        document.getElementById('upload-preview-img').src = pendingB64;
        document.getElementById('upload-preview').style.display = '';
        document.getElementById('upload-zone').style.display = 'none';
    };
    reader.readAsDataURL(file);
}
function saveFromUpload() {
    if (!pendingB64) { toast('No image selected.','error'); return; }
    saveScanner(pendingB64);
    updateProductScanner(pendingB64);
    toast('<i class="fa-solid fa-check-circle mr-2"></i>Scanner saved!');
    setTimeout(() => renderScanner(), 500);
}
function updateProductScanner(val) {
    const all = JSON.parse(localStorage.getItem('milletProducts')||'[]');
    all.forEach(p => { if(p.farmer_email===farmer.email||String(p.farmer_id)===String(farmer.id)) p.farmer_scanner=val; });
    localStorage.setItem('milletProducts', JSON.stringify(all));
}
function removeScanner() {
    if (!confirm('Remove your payment scanner?')) return;
    localStorage.removeItem(`farmer_scanner_${farmer.email}`);
    localStorage.removeItem('farmer_scanner_default');
    toast('Scanner removed.','info'); renderScanner();
}

function updateStatus(orderId, newStatus) {
    const all = allOrders().map(o => String(o.id)===String(orderId) ? {...o, status:newStatus, order_status:newStatus} : o);
    localStorage.setItem('milletOrders', JSON.stringify(all));
    fetch(`${API}/orders/${orderId}/status`,{method:'PATCH',headers:hdrs(),body:JSON.stringify({order_status:newStatus})}).catch(()=>{});
    toast(`Order #${orderId} → <strong>${newStatus.toUpperCase()}</strong>`);
}

                            <span class="badge" style="background:${p.stock_quantity>10?'#ecfdf5':'#fef2f2'};color:${p.stock_quantity>10?'#065f46':'#991b1b'};">${p.stock_quantity}</span>
                        </td>
                        <td style="padding:12px;text-align:center;">
                            ${p.farmer_scanner?`<span class="badge" style="background:#ecfdf5;color:#065f46;"><i class="fa-solid fa-check mr-1"></i>Active</span>`:`<span class="badge" style="background:#fef2f2;color:#991b1b;">None</span>`}
                        </td>
                    </tr>`).join('')}
                </tbody>
            </table>
        </div>
    </div>` : ''}`;
}
</script>
</body>
