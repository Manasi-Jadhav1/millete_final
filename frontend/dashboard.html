<!DOCTYPE html>
<html lang="en" style="scroll-behavior: smooth;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MilletVerse - Harvest Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#5b2d22',
                        primaryLight: '#faf7f2',
                        primaryDark: '#3d1e17',
                        accent: '#d4a373',
                        textDark: '#2c1810',
                        textGray: '#8b736b',
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'], heading: ['Outfit', 'sans-serif'] }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="text-textDark font-sans antialiased overflow-x-hidden bg-primaryLight flex flex-col h-screen">

    <nav class="bg-primaryDark text-white py-4 px-6 lg:px-10 flex items-center justify-between shrink-0 shadow-2xl z-50">
        <a href="index.html" class="flex flex-col items-center group">
            <span class="font-heading font-black text-2xl lg:text-3xl tracking-widest text-white">MILLETVERSE</span>
            <span class="text-[8px] font-black tracking-[0.5em] text-accent/70 uppercase">Farmer & Harvest Keeper</span>
        </a>

        <!-- Quick Navbar Farmer Actions -->
        <div id="quick-farmer-actions" class="hidden sm:flex items-center gap-3">
            <button onclick="loadSection('add-product')" class="bg-emerald-600 hover:bg-emerald-700 text-white font-black text-xs uppercase tracking-widest px-4 py-2.5 rounded-xl shadow-lg transition-all flex items-center gap-2">
                <i class="fa-solid fa-plus-circle text-sm"></i> List New Harvest
            </button>
            <button onclick="loadSection('inventory')" class="bg-white/10 hover:bg-white/20 text-white font-black text-xs uppercase tracking-widest px-4 py-2.5 rounded-xl transition-all flex items-center gap-2">
                <i class="fa-solid fa-boxes-stacked text-sm"></i> Inventory
            </button>
        </div>

        <div class="flex items-center gap-4 cursor-pointer relative group">
            <div class="text-right hidden sm:block">
                <p id="header-name" class="text-xs uppercase font-black tracking-widest text-white mb-0.5">Farmer Keeper</p>
                <p id="role-text" class="text-[8px] text-emerald-400 uppercase tracking-[0.2em] font-black">Verified Producer</p>
            </div>
            <div class="w-12 h-12 rounded-2xl bg-accent text-primaryDark flex items-center justify-center shadow-xl border-2 border-accent overflow-hidden">
                <img src="https://images.unsplash.com/photo-1594824436951-7f12bc44ce7e?w=100&h=100&fit=crop" class="w-full h-full object-cover">
            </div>
            <div class="absolute right-0 top-full mt-2 w-56 bg-white rounded-2xl shadow-2xl border border-gray-100 py-2 hidden group-hover:block z-50">
                <button onclick="milletLogout()" class="w-full text-left flex items-center gap-3 px-5 py-3 text-xs font-black text-red-500 hover:bg-red-50 uppercase">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </nav>

    <!-- Mobile Top Navigation Bar for Tabs -->
    <div class="lg:hidden bg-white border-b border-gray-100 p-3 overflow-x-auto flex gap-2 shrink-0" id="mobile-menu-container">
        <!-- Injected dynamically by JS -->
    </div>

    <main class="flex-1 flex overflow-hidden">
        <aside class="w-72 bg-white border-r border-gray-100 flex flex-col hidden lg:flex shrink-0">
            <div class="p-8 border-b border-gray-50"><h3 class="font-black text-gray-400 text-[10px] tracking-[0.4em] uppercase">HARVEST MENU</h3></div>
            <div class="flex-1 overflow-y-auto p-4 space-y-2" id="sidebar-menu"></div>
        </aside>

        <div class="flex-1 overflow-y-auto p-6 lg:p-12 relative" id="main-content-area">
            <!-- Dynamic Content -->
        </div>
    </main>

    <script src="auth.js"></script>
    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const session = JSON.parse(localStorage.getItem('milletSession'));
            if (!session) { window.location.href = 'login.html'; return; }

            // Admin users get their own dedicated dashboard
            if (session.role === 'admin') {
                window.location.href = 'admin-dashboard.html';
                return;
            }
            
            document.getElementById('header-name').innerText = `${session.firstName} ${session.lastName}`;
            document.getElementById('role-text').innerText = session.role.toUpperCase();

            renderSidebar(session.role);

            // Default section per role
            const initialSection = (session.role === 'farmer' || session.role === 'seller' || session.role === 'startup') ? 'add-product' : 'orders';
            loadSection(initialSection);
        });

        function renderSidebar(role) {
            const menu = document.getElementById('sidebar-menu');
            const mobileMenu = document.getElementById('mobile-menu-container');
            let links = [];
            
            if (role === 'consumer' || role === 'user') {
                links = [
                    { id: 'orders', icon: 'fa-box-open', text: 'My Orders' },
                    { id: 'order-analytics', icon: 'fa-chart-bar', text: 'Order Analytics' },
                    { id: 'cart', icon: 'fa-shopping-cart', text: 'My Cart' },
                    { id: 'profile', icon: 'fa-user-circle', text: 'Profile Settings' }
                ];
            } else if (role === 'seller' || role === 'startup' || role === 'farmer') {
                links = [
                    { id: 'add-product', icon: 'fa-plus-circle', text: 'List New Harvest', highlight: true },
                    { id: 'payment-scanner', icon: 'fa-qrcode', text: 'My Payment Scanner' },
                    { id: 'inventory', icon: 'fa-boxes-stacked', text: 'Grain Inventory' },
                    { id: 'sales', icon: 'fa-sack-dollar', text: 'Seller Orders' },
                    { id: 'sales-analytics', icon: 'fa-chart-line', text: 'Sales Analytics' },
                    { id: 'add-recipe', icon: 'fa-mortar-pestle', text: 'List New Recipe' }
                ];
            }

            if (menu) {
                menu.innerHTML = links.map(l => `
                    <button onclick="loadSection('${l.id}')" id="tab-${l.id}" class="w-full flex items-center gap-4 px-5 py-4 ${l.highlight ? 'bg-emerald-600 text-white shadow-lg' : 'text-gray-500 hover:bg-primaryLight hover:text-primary'} rounded-2xl font-black text-xs uppercase tracking-widest transition-all">
                        <i class="fa-solid ${l.icon} text-sm"></i> ${l.text}
                    </button>
                `).join('');
            }

            if (mobileMenu) {
                mobileMenu.innerHTML = links.map(l => `
                    <button onclick="loadSection('${l.id}')" class="whitespace-nowrap flex items-center gap-2 px-4 py-2.5 ${l.highlight ? 'bg-emerald-600 text-white' : 'bg-gray-100 text-gray-700'} rounded-xl font-black text-[10px] uppercase tracking-wider shrink-0">
                        <i class="fa-solid ${l.icon}"></i> ${l.text}
                    </button>
                `).join('');
            }
        }

        async function loadSection(section) {
            const container = document.getElementById('main-content-area');
            const session = JSON.parse(localStorage.getItem('milletSession'));
            
            if (section === 'payment-scanner') {
                const saved = typeof getFarmerSavedScanner === 'function' ? getFarmerSavedScanner() : null;
                const farmName = saved?.farmer_name || `${session?.firstName || 'Farmer'}'s Organic Farm`;
                const farmUpi = saved?.farmer_upi || `${session?.firstName?.toLowerCase() || 'farmer'}@upi`;
                const customQr = saved?.custom_qr || '';

                const upiUri = `upi://pay?pa=${encodeURIComponent(farmUpi)}&pn=${encodeURIComponent(farmName)}&cu=INR`;
                const qrImg = (customQr && customQr.startsWith('data:image')) ? customQr
                            : (customQr && customQr.startsWith('http')) ? customQr
                            : `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiUri)}`;

                container.innerHTML = `
                    <div class="flex items-center justify-between mb-8">
                        <div>
                            <h2 class="text-4xl font-black text-textDark">My Payment Scanner</h2>
                            <p class="text-sm font-bold text-amber-800 mt-1"><i class="fa-solid fa-qrcode"></i> Configure your direct UPI Scanner — attach via URL <strong>or</strong> upload your own QR image.</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
                        <div class="lg:col-span-2 bg-white p-10 rounded-[3.5rem] shadow-xl border border-gray-100">
                            <form onsubmit="handleDashboardSaveScanner(event)" class="space-y-6">
                                <div>
                                    <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">FARM / PRODUCER NAME</label>
                                    <input id="dash-scan-name" value="${farmName}" oninput="updateDashboardScannerPreview()" class="w-full bg-primaryLight p-4 rounded-2xl font-bold border border-gray-100 focus:ring-2 focus:ring-amber-500 text-sm" required>
                                </div>
                                <div>
                                    <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">FARMER UPI ID (FOR DIRECT BUYER SCAN & PAY)</label>
                                    <input id="dash-scan-upi" value="${farmUpi}" oninput="updateDashboardScannerPreview()" class="w-full bg-primaryLight p-4 rounded-2xl font-mono font-bold border border-gray-100 focus:ring-2 focus:ring-amber-500 text-sm" required>
                                </div>

                                <!-- Scanner Input: URL or Image Upload -->
                                <div class="border border-gray-100 rounded-3xl p-6 space-y-4 bg-amber-50/40">
                                    <h4 class="text-[10px] font-black uppercase tracking-widest text-amber-800"><i class="fa-solid fa-image mr-1"></i> Payment QR Scanner Source</h4>
                                    <!-- Toggle tabs -->
                                    <div class="flex gap-2 mb-2">
                                        <button type="button" id="tab-url" onclick="switchScannerTab('url')" class="px-4 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest bg-amber-600 text-white">URL Link</button>
                                        <button type="button" id="tab-upload" onclick="switchScannerTab('upload')" class="px-4 py-1.5 rounded-xl text-[10px] font-black uppercase tracking-widest bg-gray-100 text-gray-500 hover:bg-amber-100">Upload Image</button>
                                    </div>
                                    <!-- URL Input -->
                                    <div id="scanner-url-panel">
                                        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">CUSTOM QR IMAGE URL</label>
                                        <input id="dash-scan-qr" value="${customQr && !customQr.startsWith('data:') ? customQr : ''}" oninput="updateDashboardScannerPreview()" placeholder="https://your-qr-image.png — or leave empty to auto-generate" class="w-full bg-white p-4 rounded-2xl font-bold border border-amber-200 focus:ring-2 focus:ring-amber-500 text-sm">
                                    </div>
                                    <!-- Image Upload -->
                                    <div id="scanner-upload-panel" class="hidden">
                                        <label class="block text-[10px] font-black uppercase tracking-widest text-gray-400 mb-2">UPLOAD YOUR QR IMAGE</label>
                                        <div class="border-2 border-dashed border-amber-300 rounded-2xl p-6 text-center cursor-pointer hover:bg-amber-50 transition-all" onclick="document.getElementById('qr-file-input').click()">
                                            <i class="fa-solid fa-upload text-amber-500 text-2xl mb-2"></i>
                                            <p class="text-xs font-black text-amber-700 uppercase tracking-widest">Click to upload QR image</p>
                                            <p class="text-[10px] text-gray-400 font-bold mt-1">PNG, JPG — max 2MB</p>
                                        </div>
                                        <input type="file" id="qr-file-input" accept="image/*" class="hidden" onchange="handleScannerImageUpload(event)">
                                        <p id="upload-filename" class="text-[10px] text-emerald-700 font-bold mt-2 hidden"><i class="fa-solid fa-check-circle"></i> <span></span></p>
                                    </div>
                                    <p class="text-[9px] text-amber-700 font-bold"><i class="fa-solid fa-circle-info"></i> Your scanner auto-attaches to all your product listings.</p>
                                </div>

                                <button type="submit" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-black py-4 rounded-2xl uppercase tracking-widest shadow-xl transition-all hover:scale-[1.02] flex items-center justify-center gap-2">
                                    <i class="fa-solid fa-floppy-disk"></i> Save & Activate Payment Scanner
                                </button>
                            </form>
                        </div>

                        <!-- Live Scanner Card -->
                        <div class="bg-gradient-to-br from-amber-50 to-orange-50 p-8 rounded-[3.5rem] border border-amber-200 text-center flex flex-col items-center justify-center space-y-4">
                            <span class="text-[9px] font-black uppercase tracking-[0.3em] text-amber-900 bg-amber-200/60 px-3 py-1 rounded-full">
                                Live Preview
                            </span>
                            <div class="w-48 h-48 bg-white p-3 rounded-2xl shadow-lg border-2 border-amber-300 flex items-center justify-center relative">
                                <img id="dash-scan-preview" src="${qrImg}" class="w-full h-full object-contain rounded-xl">
                                <div class="absolute inset-x-2 h-0.5 bg-amber-500/70 animate-pulse top-3 pointer-events-none"></div>
                            </div>
                            <div>
                                <h4 id="dash-scan-name-display" class="font-black text-textDark text-base">${farmName}</h4>
                                <p id="dash-scan-upi-display" class="font-mono font-bold text-amber-800 text-xs mt-0.5">${farmUpi}</p>
                            </div>
                            <div class="flex gap-2 flex-wrap justify-center">
                                <span class="text-[9px] font-bold bg-white px-2 py-0.5 rounded border border-amber-200 text-gray-700">Google Pay</span>
                                <span class="text-[9px] font-bold bg-white px-2 py-0.5 rounded border border-amber-200 text-purple-700">PhonePe</span>
                                <span class="text-[9px] font-bold bg-white px-2 py-0.5 rounded border border-amber-200 text-blue-700">Paytm</span>
                            </div>
                        </div>
                    </div>
                `;
            } else if (section === 'order-analytics') {
                container.innerHTML = `
                    <h2 class="text-4xl font-black mb-3">Order Analytics</h2>
                    <p class="text-sm text-gray-400 font-bold mb-10 uppercase tracking-widest">Your personal harvest purchase history</p>
                    <div id="oa-content">Loading...</div>
                `;
                let myOrders = JSON.parse(localStorage.getItem('milletOrders') || '[]');
                // Also try to get from backend
                try {
                    const r = await fetch('http://localhost:5000/api/orders/my-orders', { headers: { 'Authorization': `Bearer ${session.token}` } });
                    const d = await r.json();
                    if (d.success && d.data && d.data.length) myOrders = [...myOrders, ...d.data];
                } catch(e) {}
                const totalSpend = myOrders.reduce((s,o) => s + parseFloat(o.total_price || (o.items||[]).reduce((a,i)=>a+i.price*i.qty,0) || 0), 0);
                const byStatus = {};
                myOrders.forEach(o => { const st = o.status || o.order_status || 'Unknown'; byStatus[st] = (byStatus[st]||0)+1; });
                const statusColors = { 'Online Payment Verified — Preparing Dispatch':'bg-emerald-500','Confirmed — Pay on Delivery':'bg-amber-500','shipped':'bg-blue-500','delivered':'bg-green-600','cancelled':'bg-red-500' };
                document.getElementById('oa-content').innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-50 text-center">
                            <div class="w-14 h-14 bg-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i class="fa-solid fa-indian-rupee-sign text-2xl text-emerald-600"></i>
                            </div>
                            <p class="text-4xl font-black text-primaryDark">₹${totalSpend.toFixed(2)}</p>
                            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mt-2">Total Spent</p>
                        </div>
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-50 text-center">
                            <div class="w-14 h-14 bg-blue-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i class="fa-solid fa-box text-2xl text-blue-600"></i>
                            </div>
                            <p class="text-4xl font-black text-primaryDark">${myOrders.length}</p>
                            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mt-2">Total Orders</p>
                        </div>
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-50 text-center">
                            <div class="w-14 h-14 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i class="fa-solid fa-star text-2xl text-amber-600"></i>
                            </div>
                            <p class="text-4xl font-black text-primaryDark">₹${myOrders.length ? (totalSpend/myOrders.length).toFixed(0) : 0}</p>
                            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mt-2">Avg Order Value</p>
                        </div>
                    </div>
                    <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-50 mb-8">
                        <h3 class="font-black text-lg mb-6">Orders by Status</h3>
                        <div class="space-y-4">
                            ${Object.entries(byStatus).map(([st, cnt]) => `
                                <div>
                                    <div class="flex justify-between text-xs font-black uppercase tracking-widest mb-1">
                                        <span class="text-gray-500 truncate max-w-[70%]">${st}</span>
                                        <span class="text-primaryDark">${cnt}</span>
                                    </div>
                                    <div class="w-full bg-gray-100 rounded-full h-3">
                                        <div class="${statusColors[st] || 'bg-primary'} h-3 rounded-full transition-all" style="width:${Math.min(100,(cnt/myOrders.length)*100)}%"></div>
                                    </div>
                                </div>
                            `).join('') || '<p class="text-gray-300 font-black uppercase">No orders yet.</p>'}
                        </div>
                    </div>
                `;
            } else if (section === 'sales-analytics') {
                container.innerHTML = `
                    <h2 class="text-4xl font-black mb-3">Sales Analytics</h2>
                    <p class="text-sm text-gray-400 font-bold mb-10 uppercase tracking-widest">Your harvest sales performance</p>
                    <div id="sa-content">Loading...</div>
                `;
                let sellerOrders = [];
                try {
                    const r = await fetch('http://localhost:5000/api/orders/seller/orders', { headers: { 'Authorization': `Bearer ${session.token}` } });
                    const d = await r.json();
                    if (d.success && d.data) sellerOrders = d.data;
                } catch(e) {}
                const totalRev = sellerOrders.reduce((s,o) => s + parseFloat(o.total_price||0), 0);
                const byStatus = {};
                sellerOrders.forEach(o => { const st = o.order_status || 'Unknown'; byStatus[st] = (byStatus[st]||0)+1; });
                const statusColors2 = { pending:'bg-amber-500', confirmed:'bg-blue-500', processing:'bg-indigo-500', shipped:'bg-purple-500', delivered:'bg-emerald-500', cancelled:'bg-red-500' };
                document.getElementById('sa-content').innerHTML = `
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-50 text-center">
                            <div class="w-14 h-14 bg-emerald-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i class="fa-solid fa-indian-rupee-sign text-2xl text-emerald-600"></i>
                            </div>
                            <p class="text-4xl font-black text-primaryDark">₹${totalRev.toFixed(2)}</p>
                            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mt-2">Total Revenue</p>
                        </div>
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-50 text-center">
                            <div class="w-14 h-14 bg-primary/10 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i class="fa-solid fa-seedling text-2xl text-primary"></i>
                            </div>
                            <p class="text-4xl font-black text-primaryDark">${sellerOrders.length}</p>
                            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mt-2">Total Orders</p>
                        </div>
                        <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-50 text-center">
                            <div class="w-14 h-14 bg-amber-100 rounded-2xl flex items-center justify-center mx-auto mb-4">
                                <i class="fa-solid fa-chart-line text-2xl text-amber-600"></i>
                            </div>
                            <p class="text-4xl font-black text-primaryDark">₹${sellerOrders.length ? (totalRev/sellerOrders.length).toFixed(0) : 0}</p>
                            <p class="text-[10px] font-black uppercase tracking-widest text-gray-400 mt-2">Avg Order Value</p>
                        </div>
                    </div>
                    <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-50 mb-8">
                        <h3 class="font-black text-lg mb-6">Orders by Status</h3>
                        <div class="space-y-4">
                            ${Object.entries(byStatus).map(([st, cnt]) => `
                                <div>
                                    <div class="flex justify-between text-xs font-black uppercase tracking-widest mb-1">
                                        <span class="text-gray-500">${st}</span>
                                        <span>${cnt}</span>
                                    </div>
                                    <div class="w-full bg-gray-100 rounded-full h-3">
                                        <div class="${statusColors2[st]||'bg-primary'} h-3 rounded-full" style="width:${Math.min(100,(cnt/sellerOrders.length)*100)}%"></div>
                                    </div>
                                </div>
                            `).join('') || '<p class="text-gray-300 font-black uppercase">No sales data yet.</p>'}
                        </div>
                    </div>
                    <div class="bg-white p-8 rounded-[2.5rem] shadow-sm border border-gray-50">
                        <h3 class="font-black text-lg mb-6">Recent Sales</h3>
                        <div class="space-y-4">
                            ${sellerOrders.slice(0,5).map(o => `
                                <div class="flex justify-between items-center py-3 border-b border-gray-50">
                                    <div>
                                        <p class="font-black text-sm">${o.product_name || 'Grain Product'}</p>
                                        <p class="text-[10px] text-gray-400 font-bold uppercase tracking-widest">#${o.id} • ${o.user_name||'Customer'}</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="font-black text-primary">₹${o.total_price}</p>
                                        <span class="text-[8px] bg-gray-100 px-2 py-0.5 rounded font-black uppercase text-gray-500">${o.order_status}</span>
                                    </div>
                                </div>
                            `).join('') || '<p class="text-gray-300 font-black uppercase text-sm">No recent sales.</p>'}
                        </div>
                    </div>
                `;
            } else if (section === 'orders') {
                container.innerHTML = `<h2 class="text-4xl font-black mb-12">Your Harvest History</h2><div id="orders-list" class="space-y-6">Loading...</div>`;
                const res = await fetch('http://localhost:5000/api/orders/my-orders', { headers: { 'Authorization': `Bearer ${session.token}` } });
                const data = await res.json();
                const list = document.getElementById('orders-list');
                list.innerHTML = data.success && data.data.length ? data.data.map(o => `
                    <div class="bg-white p-10 rounded-[3rem] shadow-sm border border-gray-50 flex justify-between items-center group hover:shadow-xl transition-all">
                        <div>
                            <p class="text-[10px] font-black text-accent uppercase tracking-widest mb-2">Order #${o.id} • ${new Date(o.order_date).toLocaleDateString()}</p>
                            <h4 class="text-2xl font-black">${o.product_name || 'Ancient Grain'} (${o.quantity} units)</h4>
                            <span class="inline-block mt-4 px-4 py-2 bg-primary text-white text-[10px] font-black rounded-xl uppercase tracking-widest">${o.order_status}</span>
                        </div>
                        <div class="text-right">

        /* ===== Scanner Tab Switch ===== */
        function switchScannerTab(tab) {
            const urlPanel    = document.getElementById('scanner-url-panel');
            const uploadPanel = document.getElementById('scanner-upload-panel');
            const tabUrl      = document.getElementById('tab-url');
            const tabUpload   = document.getElementById('tab-upload');
            if (tab === 'url') {
                urlPanel?.classList.remove('hidden');
                uploadPanel?.classList.add('hidden');
                tabUrl?.classList.replace('bg-gray-100','bg-amber-600');
                tabUrl?.classList.replace('text-gray-500','text-white');
                tabUpload?.classList.replace('bg-amber-600','bg-gray-100');
                tabUpload?.classList.replace('text-white','text-gray-500');
            } else {
                urlPanel?.classList.add('hidden');
                uploadPanel?.classList.remove('hidden');
                tabUpload?.classList.replace('bg-gray-100','bg-amber-600');
                tabUpload?.classList.replace('text-gray-500','text-white');
                tabUrl?.classList.replace('bg-amber-600','bg-gray-100');
                tabUrl?.classList.replace('text-white','text-gray-500');
            }
        }

        function handleScannerImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                const base64 = e.target.result;
                // Store base64 in a temporary global for preview
                window._uploadedScannerBase64 = base64;
                const previewImg = document.getElementById('dash-scan-preview');
                if (previewImg) previewImg.src = base64;
                // Show filename
                const fnEl = document.getElementById('upload-filename');
                if (fnEl) { fnEl.classList.remove('hidden'); fnEl.querySelector('span').textContent = file.name; }
            };
            reader.readAsDataURL(file);
        }

        function updateDashboardScannerPreview() {
            const name = document.getElementById('dash-scan-name')?.value || 'Farmer Farm';
            const upi = document.getElementById('dash-scan-upi')?.value || 'farmer@upi';
            const customQr = document.getElementById('dash-scan-qr')?.value;
            const previewImg = document.getElementById('dash-scan-preview');
            const nameDisp = document.getElementById('dash-scan-name-display');
            const upiDisp = document.getElementById('dash-scan-upi-display');

            if (nameDisp) nameDisp.innerText = name;
            if (upiDisp) upiDisp.innerText = upi;

            // Only update from URL if no uploaded image is pending
            if (previewImg && !window._uploadedScannerBase64) {
                if (customQr && customQr.startsWith('http')) {
                    previewImg.src = customQr;
                } else {
                    const upiUri = `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name)}&cu=INR`;
                    previewImg.src = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiUri)}`;
                }
            }
        }

        function handleDashboardSaveScanner(e) {
            e.preventDefault();
            const session = JSON.parse(localStorage.getItem('milletSession') || 'null');
            const name = document.getElementById('dash-scan-name').value.trim();
            const upi = document.getElementById('dash-scan-upi').value.trim();
            const customQrUrl = document.getElementById('dash-scan-qr')?.value.trim() || '';

            // Determine final QR: uploaded image base64 > URL > auto-generated
            let finalQr;
            let storedCustomQr = customQrUrl;
            if (window._uploadedScannerBase64) {
                finalQr = window._uploadedScannerBase64;
                storedCustomQr = window._uploadedScannerBase64;
            } else if (customQrUrl && customQrUrl.startsWith('http')) {
                finalQr = customQrUrl;
            } else {
                const upiUri = `upi://pay?pa=${encodeURIComponent(upi)}&pn=${encodeURIComponent(name)}&cu=INR`;
                finalQr = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiUri)}`;
            }

            const scannerData = {
                farmer_name: name,
                farmer_upi: upi,
                custom_qr: storedCustomQr,
                payment_qr: finalQr,
                updated_at: new Date().toISOString()
            };

            if (session) {
                if (session.id) localStorage.setItem(`farmer_scanner_${session.id}`, JSON.stringify(scannerData));
                if (session.email) localStorage.setItem(`farmer_scanner_${session.email}`, JSON.stringify(scannerData));
            }
            localStorage.setItem('farmer_scanner_default', JSON.stringify(scannerData));

            // Sync all products for this farmer
            let products = JSON.parse(localStorage.getItem('milletProducts') || '[]');
            products = products.map(p => {
                if (!p.farmer_upi || (session && (p.seller_id == session.id || p.sellerEmail == session.email))) {
                    p.farmer_name = name;
                    p.farmer_upi = upi;
                    p.payment_qr = finalQr;
                    p.is_farmer = true;
                }
                return p;
            });
            localStorage.setItem('milletProducts', JSON.stringify(products));

            window._uploadedScannerBase64 = null; // Clear after save
            showToast('🌾 Payment Scanner saved & activated for all your products!', 'success');
        }

        async function handleAddProduct(e) {
            e.preventDefault();
            const session = JSON.parse(localStorage.getItem('milletSession')) || { firstName: 'Farmer', token: '' };
            
            const name = document.getElementById('p-name').value;
            const price = parseFloat(document.getElementById('p-price').value);
            const millet_type = document.getElementById('p-type').value;
            const stock_quantity = parseInt(document.getElementById('p-stock').value) || 100;
            const farm_name = document.getElementById('p-farm')?.value || `${session.firstName}'s Organic Farm`;
            const upi_id = document.getElementById('p-upi')?.value || `${session.firstName.toLowerCase()}@upi`;
            let custom_qr = document.getElementById('p-qr')?.value;
            
            if (!custom_qr) {
                const upiUri = `upi://pay?pa=${encodeURIComponent(upi_id)}&pn=${encodeURIComponent(farm_name)}&cu=INR`;
                custom_qr = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(upiUri)}`;
            }

            const newProduct = {
                id: Date.now(),
                name: name,
                title: name,
                description: document.getElementById('p-desc').value,
                price: price,
                millet_type: millet_type,
                image_url: document.getElementById('p-img').value || 'assets/ragi.png',
                image: document.getElementById('p-img').value || 'assets/ragi.png',
                stock_quantity: stock_quantity,
                ingredients: '100% Organic Direct Farm Grain',
                is_farmer: true,
                farmer_name: farm_name,
                farmer_upi: upi_id,
                payment_qr: custom_qr,
                seller_id: session.id
            };

            // 1. Save to local marketplace products array
            let localProducts = JSON.parse(localStorage.getItem('milletProducts') || '[]');
            localProducts.unshift(newProduct);
            localStorage.setItem('milletProducts', JSON.stringify(localProducts));

            // 2. Try posting to backend API if running
            try {
                await fetch('http://localhost:5000/api/products', {
                    method: 'POST',
                    headers: { 
                        'Content-Type': 'application/json', 
                        'Authorization': `Bearer ${session.token}` 
                    },
                    body: JSON.stringify(newProduct)
                });
            } catch (err) {
                console.log('Backend API offline, harvest saved to local marketplace');
            }

            showToast('🌾 Direct Harvest & Payment Scanner posted successfully!', 'success'); 
            e.target.reset();
            loadSection('inventory');
        }

        async function updateStatus(id, status) {
            const session = JSON.parse(localStorage.getItem('milletSession'));
            const res = await fetch(`http://localhost:5000/api/orders/${id}/status`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.token}` },
                body: JSON.stringify({ status })
            });
            const data = await res.json();
            if (data.success) { showToast('Order status updated!'); loadSection('sales'); }
        }

        async function handleAddRecipe(e) {
            e.preventDefault();
            const session = JSON.parse(localStorage.getItem('milletSession'));
            const body = {
                title: document.getElementById('r-title').value,
                category: document.getElementById('r-category').value,
                subcategory: document.getElementById('r-sub').value,
                image_url: document.getElementById('r-img').value,
                description: document.getElementById('r-desc').value,
                content: document.getElementById('r-content').value,
                author_id: session.id
            };
            const res = await fetch('http://localhost:5000/api/learning', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${session.token}` },
                body: JSON.stringify(body)
            });
            const data = await res.json();
            if (data.success) { 
                showToast('Wisdom shared successfully!', 'success'); 
                e.target.reset();
            } else { 
                showToast(data.message, 'error'); 
            }
        }

        async function removeCartItem(productId, title) {
            const session = JSON.parse(localStorage.getItem('milletSession'));
            let removed = false;

            // Try removing from cloud
            try {
                const res = await fetch(`http://localhost:5000/api/cart/remove/${productId}`, {
                    method: 'DELETE',
                    headers: { 'Authorization': `Bearer ${session.token}` }
                });
                const data = await res.json();
                if (data.success) removed = true;
            } catch (e) { console.error("Cloud removal failed", e); }

            // Also try removing from local
            let localCart = JSON.parse(localStorage.getItem('milletCart') || '[]');
            const initialLen = localCart.length;
            localCart = localCart.filter(item => item.id !== productId && item.title !== title);
            if (localCart.length < initialLen) {
                localStorage.setItem('milletCart', JSON.stringify(localCart));
                removed = true;
            }

            if (removed) {
                showToast('Item removed from seeds bag');
                loadSection('cart');
                if (window.updateCartCount) updateCartCount();
            }
        }

        function loadContent(role) {
            if (role === 'consumer' || role === 'user') loadSection('orders');
            else if (role === 'admin') loadSection('admin-stats');
            else loadSection('inventory');
        }
    </script>
</body>
</html>
